name: Desktop client

on:
  push:
    branches: ["**"]
    paths:
      - "client/**"
      - ".github/workflows/client.yml"
  pull_request:
    paths:
      - "client/**"
      - ".github/workflows/client.yml"
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One red platform should not hide the other's result.
      fail-fast: false
      matrix:
        # Both target platforms are tested: the virtual camera backend differs
        # per OS, and so does socket behaviour under load.
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: client/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # pyvirtualcam is deliberately NOT installed: there is no v4l2loopback
          # or OBS on a CI runner, and the suite is built to pass without one.
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Test
        # The integration tests use real sockets and real streams, so they are
        # timing-sensitive on shared runners; the timeout is generous on purpose.
        timeout-minutes: 15
        run: python -m pytest -q --durations=10

      - name: Smoke test the CLI
        shell: bash
        run: |
          python -m lostcam --version
          python -m lostcam --help > /dev/null
          # doctor must exit cleanly even with no virtual camera present, since
          # that is precisely the situation it exists to diagnose.
          python -m lostcam doctor || true

      - name: End-to-end capture against the mock sender
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          python -m lostcam mocksender --port 4747 --width 320 --height 240 &
          MOCK=$!
          # Wait for the port rather than sleeping a fixed amount.
          python - <<'PY'
          from lostcam.puller import wait_for_port
          assert wait_for_port("127.0.0.1", 4747, timeout=30), "mock sender never came up"
          PY
          python -m lostcam capture 127.0.0.1 --out ci-dataset --frames 20 \
            --warmup 2 --roi 40,40,240,160 --plate-mm 220 --overwrite
          kill $MOCK || true
          # Prove the dataset is actually readable and populated, not just created.
          python - <<'PY'
          from lostcam.dataset import read_manifest
          records = read_manifest("ci-dataset")
          assert len(records) >= 20, f"only {len(records)} frames recorded"
          assert all("metrics" in r for r in records), "frames missing metrics"
          with_samples = [r for r in records if r.get("samples")]
          assert with_samples, "no telemetry was aligned onto any frame"
          print(f"OK: {len(records)} frames, {len(with_samples)} with telemetry")
          PY
