# XcodeGen spec. The .xcodeproj is generated rather than committed, so CI and
# every developer get an identical project and there are no pbxproj merge
# conflicts. Generate with: xcodegen generate (run from this directory).
name: LostCam
options:
  bundleIdPrefix: com.lostmediastudios
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # CI builds are unsigned; a real device install needs a team set here or
    # passed on the xcodebuild command line.
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  LostCam:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      # Generated by XcodeGen, and kept outside Sources/ so it is never also
      # picked up as a bundle resource.
      path: Supporting/Info.plist
      properties:
        CFBundleDisplayName: LostCam
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Every one of these is required, and iOS kills the app without them.
        NSCameraUsageDescription: >-
          LostCam streams this camera to your computer so the phone can be used
          as a webcam.
        NSMicrophoneUsageDescription: >-
          LostCam streams the microphone to your computer so the phone can be
          used as a microphone.
        NSMotionUsageDescription: >-
          LostCam streams motion and orientation measurements to your computer
          when you enable the motion channels.
        NSLocationWhenInUseUsageDescription: >-
          LostCam only reads location if you explicitly enable the location
          channel; it is off by default.
        NSLocalNetworkUsageDescription: >-
          LostCam runs a small server on your local network so your computer can
          connect to this phone.
        NSBonjourServices:
          - _lostcam._tcp
        # Streaming must survive the screen dimming, so audio background mode is
        # declared for the microphone path. Note that iOS still interrupts
        # *camera* capture when the app leaves the foreground — see README.
        UIBackgroundModes:
          - audio
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lostmediastudios.lostcam
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        ENABLE_USER_SCRIPT_SANDBOXING: NO

  LostCamTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/LostCamTests
    dependencies:
      - target: LostCam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lostmediastudios.lostcam.tests

schemes:
  LostCam:
    build:
      targets:
        LostCam: all
        LostCamTests: [test]
    test:
      targets:
        - LostCamTests
      gatherCoverageData: false
